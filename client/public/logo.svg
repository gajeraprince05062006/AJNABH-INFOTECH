<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-size: 34px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 0.04em;
      }
      
      .brand-subtitle {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: url(#orangeGrad);
        letter-spacing: 0.58em;
      }
      
      .purple-glow {
        filter: drop-shadow(0 0 12px rgba(124, 92, 246, 0.4));
      }
    </style>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e40" />
      <stop offset="100%" stop-color="#ff3d00" />
    </linearGradient>
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon part (left aligned) -->
  <g transform="translate(5, 5) scale(0.8)">
    <!-- Globe/Neural Network Structure -->
    <g stroke="url(#purpleGrad)" stroke-width="1.8" fill="none" opacity="0.9" class="purple-glow">
      <path d="M 30 15 A 35 35 0 0 0 30 85" />
      <path d="M 30 15 Q 10 50 30 85" stroke-width="2.2" />
      <path d="M 30 15 Q 22 50 30 85" />
      <path d="M 30 15 Q 35 50 30 85" />
      <path d="M 30 15 Q 48 50 30 85" stroke-width="2.2" />
      
      <path d="M 12 35 Q 30 45 48 35" />
      <path d="M 8 50 Q 30 60 52 50" stroke-width="2.2" />
      <path d="M 12 65 Q 30 75 48 65" />
    </g>

    <!-- Orange/Red Nodes -->
    <g fill="url(#orangeGrad)">
      <circle cx="30" cy="15" r="4.5" />
      <circle cx="30" cy="85" r="4.5" />
      <circle cx="12" cy="35" r="3.5" />
      <circle cx="48" cy="35" r="3.5" />
      <circle cx="8" cy="50" r="4" />
      <circle cx="21" cy="50" r="4" />
      <circle cx="12" cy="65" r="3.5" />
      <circle cx="48" cy="65" r="3.5" />
      <circle cx="33" cy="38" r="4.5" />
      <circle cx="35" cy="62" r="4.5" />
    </g>

    <!-- Swooping Arrow -->
    <g filter="url(#arrowGlow)">
      <path d="M 15 62 Q 25 60 38 52 T 58 36" fill="none" stroke="url(#orangeGrad)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 54 28 L 66 32 L 60 44 Z" fill="url(#orangeGrad)" />
    </g>
  </g>

  <!-- Typography part (right aligned) -->
  <g transform="translate(82, 0)">
    <!-- AJNABH Title -->
    <text x="0" y="46" class="brand-title">AJNABH</text>
    
    <!-- INFOTECH Subtitle -->
    <text x="2" y="68" class="brand-subtitle">INFOTECH</text>
    
    <!-- Styled Accent lines matching the 3D high tech theme -->
    <line x1="2" y1="78" x2="160" y2="78" stroke="url(#purpleGrad)" stroke-width="1.5" opacity="0.6" />
    <line x1="160" y1="78" x2="280" y2="78" stroke="url(#purpleGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.3" />
  </g>
</svg>